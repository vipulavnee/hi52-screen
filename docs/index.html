<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>52-Week High Screen</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--tx:#e6e9ef;--dim:#8b93a7;--up:#2ea56b;--dn:#e05252;--hot:#e8a33d;--acc:#4a8fe7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:20px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--dim);font-size:13px;margin-bottom:14px}
.views{display:flex;gap:6px;margin-bottom:14px}
.view{padding:7px 16px;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--dim);font-size:13px;background:var(--card)}
.view.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
label{color:var(--dim);font-size:12px}
input,select{background:#0d1016;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.card .n{font-size:22px;font-weight:600}
.card .l{color:var(--dim);font-size:12px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:940px}
th{position:sticky;top:0;background:#1b1f28;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.4px;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:9px 10px;border-bottom:1px solid #1e222b;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tr:hover td{background:#1c202a}
.sym{font-weight:600}
.up{color:var(--up)}.dn{color:var(--dn)}
.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.t-thrust{background:rgba(232,163,61,.16);color:var(--hot);border:1px solid rgba(232,163,61,.4)}
.t-high{background:rgba(46,165,107,.14);color:var(--up);border:1px solid rgba(46,165,107,.35)}
.t-ca{background:rgba(224,82,82,.14);color:var(--dn);border:1px solid rgba(224,82,82,.35)}
.t-gap{background:rgba(139,147,167,.16);color:var(--dim);border:1px solid rgba(139,147,167,.35)}
.no{color:var(--dim)}
.note{color:var(--dim);font-size:12px;margin-top:14px;line-height:1.6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.ov.on{display:flex}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:640px;width:100%;max-height:82vh;overflow:auto;padding:18px}
.dlg h2{margin:0 0 4px;font-size:17px}
.cl{float:right;cursor:pointer;color:var(--dim);font-size:20px;line-height:1}
</style></head><body><div class="wrap">
<h1>52-Week High Screen</h1>
<div class="sub" id="sub">loading&hellip;</div>

<div class="views">
  <div class="view on" data-v="screen">Screen</div>
  <div class="view" data-v="portfolio">Paper Portfolio</div>
</div>

<div class="bar">
  <label>Budget per position &#8377;</label><input id="budget" type="number" value="2000" step="500" style="width:104px">
  <span id="screenCtl">
    <label>Show</label>
    <select id="filter">
      <option value="tested" selected>Tested setup: golden cross + top 20% off low</option>
      <option value="golden">Golden cross only (50DMA &gt; 200DMA)</option>
      <option value="high">New 52-week highs</option>
      <option value="thrust">Thrust (vol &gt; 2.5x)</option>
      <option value="all">Everything</option>
    </select>
    <label><input type="checkbox" id="afford" style="width:auto"> Affordable only</label>
  </span>
  <span id="pfCtl" style="display:none">
    <label>Buy signals since</label><input id="since" type="date" value="2026-06-01">
    <label><input type="checkbox" id="pfThrust" style="width:auto"> Thrust signals only</label>
  </span>
</div>

<div class="cards" id="cards"></div>
<div class="tw"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
<div class="note" id="note"></div>
</div>

<div class="ov" id="ov"><div class="dlg">
  <span class="cl" id="ovcl">&times;</span><h2 id="ovt"></h2>
  <div class="sub" id="ovs"></div><div id="ovb"></div>
</div></div>

<script>
var D=null,VIEW='screen',SORT={k:'fl',dir:-1},PX={};
function n0(v){return v==null?'-':Math.round(v).toLocaleString('en-IN');}
function n2(v){return v==null?'-':v.toFixed(2);}
function sgn(v){return v==null?'no':v>0?'up':v<0?'dn':'no';}
function pct(v){return v==null?'-':(v>0?'+':'')+v.toFixed(1)+'%';}
function card(n,l){return '<div class="card"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}
function cols(l){return '<tr>'+l.map(function(c){return '<th data-k="'+c[1]+'">'+c[0]+'</th>';}).join('')+'</tr>';}
function budget(){return Number(document.getElementById('budget').value)||2000;}

fetch('data.json?v='+Date.now()).then(function(r){return r.json();}).then(function(j){
  D=j; D.rows.forEach(function(r){PX[r.s]=r.c;});
  var age=Math.round((Date.now()-new Date(j.generatedAt).getTime())/36e5);
  document.getElementById('sub').innerHTML='Session <b>'+j.asOf+'</b> &middot; '+j.rows.length+' stocks &middot; '+
    'updated '+(age<1?'under an hour':age+'h')+' ago';
  render();
}).catch(function(e){
  document.getElementById('sub').textContent='Could not load data.json - '+e.message;
});

// ---- paper portfolio, computed here in the browser from the precomputed high-dates ----------
// One position per stock on its FIRST 52-week high in the window, filled at (prior high - 1).
// A limit order only fills if price trades there, so a stock that gapped over the level is
// filled at the open and tagged, rather than crediting an entry the market never offered.
function portfolio(){
  var b=budget(), since=document.getElementById('since').value;
  var thrustOnly=document.getElementById('pfThrust').checked;
  var rows=[],cost=0,value=0,skipped=0,gapped=0;
  for(var sym in D.hist){
    var hits=D.hist[sym].filter(function(h){return h.d>=since&&(!thrustOnly||h.th);});
    if(!hits.length)continue;
    var h=hits[0], target=h.ph-1, gap=h.l>target;
    var entry=gap?h.o:target;
    var qty=Math.floor(b/entry);
    if(qty<1){skipped++;continue;}
    var now=PX[sym]; if(now==null)continue;
    var c=qty*entry, v=qty*now;
    if(gap)gapped++;
    cost+=c; value+=v;
    rows.push({s:sym,d:h.d,entry:entry,gap:gap,th:h.th,qty:qty,cost:c,now:now,value:v,
      pnl:v-c, pnlPct:(v/c-1)*100,
      pk:h.pk!=null?(h.pk/entry-1)*100:null, tr:h.tr!=null?(h.tr/entry-1)*100:null,
      hits:D.hist[sym].filter(function(x){return x.d>=since;}).length});
  }
  return {rows:rows,cost:cost,value:value,skipped:skipped,gapped:gapped,
    winners:rows.filter(function(r){return r.pnl>0;}).length};
}

function render(){
  if(!D)return;
  if(VIEW==='portfolio')return renderPf();
  var f=document.getElementById('filter').value,aff=document.getElementById('afford').checked,b=budget();
  var rows;
  if(f==='tested'){
    // The one configuration that held up out of sample: gate on the golden cross, then take the
    // top fifth by distance off the 52-week low. Ranked against the whole universe of the day,
    // not against the gated subset, so the cut means the same thing as it did in the backtest.
    var g=D.rows.filter(function(x){return x.gd===1&&x.fl!=null;}).sort(function(a,z){return z.fl-a.fl;});
    rows=g.slice(0,Math.max(1,Math.floor(D.rows.length*0.2)));
  }
  else if(f==='golden') rows=D.rows.filter(function(x){return x.gd===1;});
  else if(f==='thrust') rows=D.rows.filter(function(x){return x.th;});
  else if(f==='high')   rows=D.rows.filter(function(x){return x.hi;});
  else rows=D.rows.slice();
  if(aff)rows=rows.filter(function(x){return x.c<=b;});
  rows=rows.slice().sort(function(a,z){var A=a[SORT.k],B=z[SORT.k];
    if(typeof A==='string')return SORT.dir*A.localeCompare(B);
    return SORT.dir*(((A==null?-1e9:A))-((B==null?-1e9:B)));});
  document.getElementById('head').innerHTML=cols([['Stock','s'],['Off low','fl'],['50>200','gd'],['vs 200DMA','a200'],
    ['Price','c'],['Day','ch'],['63d','r63'],['Buy call (5% ITM)','kk'],['Expiry','ke'],['Lot','kl']]);
  var hi=D.rows.filter(function(x){return x.hi;}).length,th=D.rows.filter(function(x){return x.th;}).length;
  var tot=rows.reduce(function(s,x){var q=Math.floor(b/x.c);return s+(q>=1?q*x.c:0);},0);
  document.getElementById('cards').innerHTML=card(hi,'new 52-week highs')+card(th,'thrust (vol &gt; 2.5x)')+
    card(rows.length,'shown')+card('&#8377;'+n0(tot),'cost to buy all shown');
  document.getElementById('body').innerHTML=rows.map(function(x){
    var q=Math.floor(b/x.c);
    return '<tr data-sym="'+x.s+'"><td class="sym">'+x.s+
      (x.th?'<span class="tag t-thrust">thrust</span>':x.hi?'<span class="tag t-high">52w high</span>':'')+
      (x.ca?'<span class="tag t-ca">split?</span>':'')+'</td>'+
      '<td class="up">'+n0(x.fl)+'%</td>'+
      '<td>'+(x.gd===1?'<span class="tag t-high">yes</span>':'<span class="no">no</span>')+'</td>'+
      '<td class="'+sgn(x.a200)+'">'+n2(x.a200)+'%</td>'+
      '<td>'+n2(x.c)+'</td><td class="'+sgn(x.ch)+'">'+n2(x.ch)+'%</td>'+
      '<td class="'+sgn(x.r63)+'">'+n2(x.r63)+'%</td>'+
      '<td>'+(x.k?('<b>'+x.k.s+'</b> CE <span class="no">('+(x.k.i>=0?'+':'')+n2(x.k.i)+'% ITM)</span>'):'<span class="no">no chain</span>')+'</td>'+
      '<td>'+(x.k?x.k.e+' <span class="no">'+x.k.d+'d</span>':'-')+'</td>'+
      '<td>'+(x.k?n0(x.k.l):'-')+'</td></tr>';
  }).join('')||'<tr><td colspan="11" class="no" style="padding:20px">Nothing matches.</td></tr>';
  document.getElementById('note').innerHTML=NOTE_SCREEN; wire();
}

function renderPf(){
  var p=portfolio();
  var pnlPct=p.cost>0?(p.value/p.cost-1)*100:null;
  document.getElementById('cards').innerHTML=
    card(p.rows.length,'positions')+card('&#8377;'+n0(p.cost),'invested')+
    card('<span class="'+sgn(p.value-p.cost)+'">&#8377;'+n0(p.value-p.cost)+'</span>','profit / loss')+
    card('<span class="'+sgn(pnlPct)+'">'+pct(pnlPct)+'</span>','return')+
    card(p.winners+' / '+p.rows.length,'winners');
  document.getElementById('head').innerHTML=cols([['Stock','s'],['Bought on','d'],['Entry','entry'],['Qty','qty'],
    ['Cost','cost'],['Price now','now'],['Value','value'],['P&L','pnl'],['Return','pnlPct'],['Peak','pk'],['Worst','tr'],['Highs','hits']]);
  var rows=p.rows.slice().sort(function(a,z){var A=a[SORT.k],B=z[SORT.k];
    if(typeof A==='string')return SORT.dir*A.localeCompare(B);
    return SORT.dir*(((A==null?-1e9:A))-((B==null?-1e9:B)));});
  document.getElementById('body').innerHTML=rows.map(function(r){
    return '<tr data-sym="'+r.s+'"><td class="sym">'+r.s+
      (r.th?'<span class="tag t-thrust">thrust</span>':'')+(r.gap?'<span class="tag t-gap">gapped</span>':'')+'</td>'+
      '<td>'+r.d+'</td><td>'+n2(r.entry)+'</td><td>'+r.qty+'</td><td>&#8377;'+n0(r.cost)+'</td>'+
      '<td>'+n2(r.now)+'</td><td>&#8377;'+n0(r.value)+'</td>'+
      '<td class="'+sgn(r.pnl)+'">&#8377;'+n0(r.pnl)+'</td><td class="'+sgn(r.pnlPct)+'">'+pct(r.pnlPct)+'</td>'+
      '<td class="up">'+pct(r.pk)+'</td><td class="dn">'+pct(r.tr)+'</td><td>'+r.hits+'</td></tr>';
  }).join('')||'<tr><td colspan="12" class="no" style="padding:20px">No signals in this window.</td></tr>';
  document.getElementById('note').innerHTML=NOTE_PF.replace('{SK}',p.skipped).replace('{GP}',p.gapped);
  wire();
}

function showHistory(sym){
  var h=(D.hist||{})[sym]||[];
  document.getElementById('ovt').textContent=sym+' - every 52-week high';
  document.getElementById('ovs').textContent=h.length+' sessions at a 52-week high in the last 2 years'+
    (h.length?' - most recent '+h[h.length-1].d:'');
  document.getElementById('ovb').innerHTML='<div class="tw"><table style="min-width:0">'+
    '<thead><tr><th>Date</th><th>Prior high</th><th>Close</th><th>Vol x</th></tr></thead><tbody>'+
    h.slice().reverse().map(function(x){
      return '<tr><td>'+x.d+(x.th?'<span class="tag t-thrust">thrust</span>':'')+'</td>'+
        '<td>'+n2(x.ph)+'</td><td>'+n2(x.c)+'</td><td>'+(x.vx==null?'-':x.vx.toFixed(1)+'x')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
  document.getElementById('ov').classList.add('on');
}

function wire(){
  document.querySelectorAll('th').forEach(function(t){
    t.onclick=function(){var k=t.dataset.k;SORT.dir=SORT.k===k?-SORT.dir:-1;SORT.k=k;render();};});
  document.querySelectorAll('tbody tr[data-sym]').forEach(function(tr){
    tr.onclick=function(){showHistory(tr.dataset.sym);};});
}

var NOTE_SCREEN='<b>Click any row</b> to see every date that stock hit a 52-week high.<br><br>'+
'<b>Why this ranking.</b> Walk-forward over 10 years on F&amp;O names, using NSE&rsquo;s own monthly derivatives bhavcopy for <i>point-in-time</i> membership, ranked on 2017-2021 and then tested on 2022-2026:<br>'+
'&nbsp;&nbsp;off-low top20 + golden cross &nbsp; +3.78 &rarr; <b>+1.20</b> &nbsp;(t 1.76)<br>'+
'&nbsp;&nbsp;% off 52-week low &nbsp; +2.82 &rarr; +1.06<br>'+
'&nbsp;&nbsp;golden cross alone &nbsp; +2.33 &rarr; +0.65<br>'+
'What did <b>not</b> survive: at a 52-week high +3.49 &rarr; <b>&minus;0.08</b>; volume &gt; 2.5x roughly zero throughout; MACD above signal &minus;0.42 &rarr; &minus;0.28 (t &minus;2.58, genuinely negative). The 52-week high and the thrust tag are kept as <b>labels</b>, not as the selector.<br><br>'+
'<b>An earlier version of this page claimed +9.47% excess.</b> That came from applying today&rsquo;s F&amp;O list to the past, which deletes every name dropped since - and names get dropped after they do badly. Fixing that alone took the universe&rsquo;s own baseline from +7.54% to <b>+0.53%</b>.<br><br>'+
'<b>Be honest about the size.</b> Nothing here clears significance on F&amp;O names: best t is 1.87, and the top setup was positive in only <b>2 of 5</b> out-of-sample years. On the full NSE universe the same setup gave +2.76 out-of-sample at t 3.36 - restricting to F&amp;O costs more than half the edge. This is a slight tilt, not an edge.<br><br>'+
'<b>Which strike.</b> Tested on 41,815 point-in-time signals, calls held to expiry:<br>'+
'&nbsp;&nbsp;<b>5% ITM</b> &mdash; 44% win, <b>31% went to zero</b>, median &minus;23%, 25% chance of a double<br>'+
'&nbsp;&nbsp;ATM &mdash; 39% win, 45% to zero, median &minus;68%<br>'+
'&nbsp;&nbsp;5% OTM &mdash; 32% win, 57% to zero &nbsp;&middot;&nbsp; 10% OTM &mdash; 25% win, <b>68% to zero</b><br>'+
'5% ITM keeps the same one-in-four shot at a double while cutting wipeouts by a third. Far-OTM strikes show higher MEAN returns, but options here are priced at FLAT volatility and real markets charge more for OTM calls (skew), so those means are overstated - win rate and wipeout rate are not affected by that bias and both point the same way. Next month, not the near one: 45 DTE beat 20 DTE at every strike.<br><br>'+
'<b>The premium is not shown, and cannot be.</b> Strikes, expiries and lot sizes come from Kite public instrument dump, but option PRICES need a broker login. The Lot column shows what one lot controls; what it costs, you check in Kite.<br><br>'+
'<b>Sizing is equal rupees, not one share each.</b> Prices span &#8377;10 to &#8377;48,895, so a fixed share count would let whichever dear stock happened to signal dominate the book.<br><br>'+
'<b>Data.</b> Yahoo prices, verified identical to Kite across 5 stocks x 9 sessions, but the endpoint is undocumented and can break without notice. A <span class="tag t-ca">split?</span> tag means adjusted and unadjusted closes disagree - check that one by hand. 44 delisted F&amp;O names had no price history at all, so even the corrected baseline is flattered.';

var NOTE_PF='<b>Paper only - nothing here was traded.</b> One position per stock, on its <b>first</b> 52-week high in the window, held to the latest session. Buying every repeat high would stack the same name a dozen times.<br><br>'+
'<b>Fill:</b> a resting buy at <b>(previous 52-week high &minus; 1)</b>. <b>{GP}</b> stocks gapped clean over that level, so those are filled at the open and tagged <span class="tag t-gap">gapped</span> rather than crediting a fill the market never offered. <b>{SK}</b> signals cost more than one budget and were skipped, which quietly leaves out the expensive end of the market.<br><br>'+
'<b>Peak</b> and <b>Worst</b> are the best and worst closes since entry - the ride you would have had to sit through, both ways. <b>Highs</b> counts 52-week highs in the window; a high count means a persistent trend, not a one-day pop.<br><br>'+
'No costs, taxes or slippage are modelled.';

document.querySelectorAll('.view').forEach(function(v){
  v.onclick=function(){
    document.querySelectorAll('.view').forEach(function(x){x.classList.remove('on');});
    v.classList.add('on');VIEW=v.dataset.v;
    document.getElementById('screenCtl').style.display=VIEW==='screen'?'':'none';
    document.getElementById('pfCtl').style.display=VIEW==='portfolio'?'':'none';
    SORT=VIEW==='portfolio'?{k:'pnlPct',dir:-1}:{k:'fl',dir:-1};render();};});
['budget','filter','afford','since','pfThrust'].forEach(function(id){
  document.getElementById(id).onchange=render;});
document.getElementById('ovcl').onclick=function(){document.getElementById('ov').classList.remove('on');};
document.getElementById('ov').onclick=function(e){if(e.target.id==='ov')document.getElementById('ov').classList.remove('on');};
</script></body></html>
